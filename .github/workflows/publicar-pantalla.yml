# Publica la pantalla del juego en cinectomia.com/juego por FTP cada vez que cambia en main.
# Necesita, en GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_DIR  (carpeta destino, termina en /; por defecto public_html/juego/)
#              API_URL  (dirección del servidor del juego, cuando esté publicado; vacío = mismo sitio)
name: Publicar pantalla

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/shared/**", "package-lock.json", ".github/workflows/publicar-pantalla.yml"]
  workflow_dispatch:

concurrency: publicar-pantalla

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests y tipos
        run: npm test && npm run typecheck
      - name: Armar la pantalla
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - name: Subir por FTP
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'public_html/juego/' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          # FTPS (Donweb exige cifrado). Sube todo; en assets/ borra lo viejo (los nombres cambian en cada versión).
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes;
            set net:max-retries 3; set net:timeout 30;
            mkdir -p -f $FTP_DIR;
            mirror --reverse --verbose --exclude-glob assets/ apps/web/dist/ $FTP_DIR;
            mirror --reverse --verbose --delete apps/web/dist/assets/ ${FTP_DIR}assets/;
            bye"
      - name: Falta configurar el FTP
        if: env.HAS_FTP != 'true'
        run: echo "::warning::No hay secretos de FTP cargados; se armó la pantalla pero no se subió."
